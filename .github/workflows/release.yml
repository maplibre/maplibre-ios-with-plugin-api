name: release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: URL of MapLibre.dynamic.plugins.xcframework.zip, with MapLibrePluginApi.xcframework.zip next to it
        required: true
        type: string
      version:
        description: Version number of release
        required: true
        type: string
      changelog_url:
        description: URL for changelog of release
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DOWNLOAD_URL: ${{ inputs.download_url }}
      VERSION: ${{ inputs.version }}
      CHANGELOG_URL: ${{ inputs.changelog_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Update binary targets in Package.swift
        run: |
          # Points binary target $1 at $2. The archive must contain an XCFramework named after the target.
          update_target() {
            curl --fail --location --output "$1.zip" "$2"
            unzip -l "$1.zip" | grep -q " $1.xcframework/Info.plist$"
            checksum="$(swift package compute-checksum "$1.zip")"
            NAME="$1" URL="$2" CHECKSUM="$checksum" perl -0pi -e \
              's/(name: "\Q$ENV{NAME}\E",\s*url: ")[^"]*(",\s*checksum: ")[^"]*/${1}$ENV{URL}${2}$ENV{CHECKSUM}/' Package.swift
            grep -qF "url: \"$2\"" Package.swift
            rm "$1.zip"
          }
          update_target MapLibre "$DOWNLOAD_URL"
          update_target MapLibrePluginApi "${DOWNLOAD_URL%/*}/MapLibrePluginApi.xcframework.zip"

      - name: Validate Package.swift
        run: swift package describe

      - name: Push Package.swift
        run: |
          git add Package.swift
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push --atomic origin main "$VERSION"

      - name: Download changelog.md
        run: |
          if [[ -n "$CHANGELOG_URL" ]]; then
            curl --fail --location --output changelog.md "$CHANGELOG_URL"
          else
            touch changelog.md
          fi

      - name: Make release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, 'pre') }}
          body_path: changelog.md
