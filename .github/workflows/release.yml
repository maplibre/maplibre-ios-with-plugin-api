name: release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: URL where zip containing the plugin-enabled XCFramework can be downloaded
        required: true
        type: string
      version:
        description: Version number of release
        required: true
        type: string
      changelog_url:
        description: URL for changelog of release
        required: false
        type: string
      plugin_api_ref:
        description: maplibre-native ref providing include/mln/plugin/plugin_api.h (defaults to ios-v<version>)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DOWNLOAD_URL: ${{ inputs.download_url }}
      VERSION: ${{ inputs.version }}
      CHANGELOG_URL: ${{ inputs.changelog_url }}
      PLUGIN_API_REF: ${{ inputs.plugin_api_ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Download zip, compute checksum
        run: |
          curl --fail --location --output plugins.xcframework.zip "$DOWNLOAD_URL"
          # The binary target is named MapLibre, so the archive must contain MapLibre.xcframework.
          unzip -l plugins.xcframework.zip | grep -q ' MapLibre.xcframework/Info.plist$'
          echo "checksum=$(swift package compute-checksum plugins.xcframework.zip)" >> "$GITHUB_ENV"
          rm plugins.xcframework.zip

      - name: Insert new checksum and download URL in Package.swift
        run: |
          sed -i '' "s#\(checksum: \"\)\([^\"]*\)#\1$checksum#" Package.swift
          sed -i '' "s#\(url: \"\)\([^\"]*\)#\1$DOWNLOAD_URL#" Package.swift

      - name: Update plugin API header
        run: |
          ref="${PLUGIN_API_REF:-ios-v$VERSION}"
          curl --fail --location \
            --output Sources/MapLibrePluginApi/include/mln/plugin/plugin_api.h \
            "https://raw.githubusercontent.com/maplibre/maplibre-native/$ref/include/mln/plugin/plugin_api.h"

      - name: Validate Package.swift
        run: |
          swift package describe
          swift build --target MapLibrePluginApi

      - name: Push Package.swift
        run: |
          git add Package.swift Sources
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push --atomic origin main "$VERSION"

      - name: Download changelog.md
        run: |
          if [[ -n "$CHANGELOG_URL" ]]; then
            curl --fail --location --output changelog.md "$CHANGELOG_URL"
          else
            touch changelog.md
          fi

      - name: Make release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, 'pre') }}
          body_path: changelog.md
